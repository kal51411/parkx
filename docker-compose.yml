version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: parkx-postgres
    environment:
      POSTGRES_USER: parkx
      POSTGRES_PASSWORD: parkx_dev_password
      POSTGRES_DB: parkx
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkx']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parkx-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkx-backend
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql+asyncpg://parkx:parkx_dev_password@postgres:5432/parkx
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - PAYMENT_PROVIDER=mock
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:3000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - NO_SHOW_GRACE_PERIOD_MINUTES=30
      - BOOKING_HOLD_MINUTES=8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkx-celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://parkx:parkx_dev_password@postgres:5432/parkx
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    command: celery -A celery_worker worker --loglevel=info --beat

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkx-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ENVIRONMENT=development
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
